# MySQL for local development:  docker compose up -d
# The backend creates its tables automatically on start (npm run db:init does the same by hand).
# Credentials below are for LOCAL DEVELOPMENT ONLY; set the same values in backend/.env
# (MYSQL_HOST=127.0.0.1, MYSQL_PORT=3306, MYSQL_USER=root, MYSQL_PASSWORD=..., MYSQL_DATABASE=civicfix_db).
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-civicfix_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-civicfix_db}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
