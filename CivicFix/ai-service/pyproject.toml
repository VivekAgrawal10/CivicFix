[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "civicfix-ai-service"
version = "0.1.0"
description = "CivicFix image-analysis and decision-support API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=2.0,<3.0",
  "pillow>=10.0,<14.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.11,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

